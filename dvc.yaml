stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/text_utils.py
      - data/raw/youtube-sentiment-90k.csv
    params:
      - data
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - baseline
    outs:
      - models/model.pkl
      - models/run_id.txt

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
      - data/processed/test.csv
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/confusion_matrix.png
  register:
    cmd: python src/register_model.py
    deps:
      - src/register_model.py
      - reports/metrics.json
      - models/run_id.txt
    params:
      - register